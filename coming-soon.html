<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>App coming soon — Nabad</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#EDEBE6;--ink:#1E1A17;--slate:#717D8A;
  --line:rgba(30,26,23,0.12);
  --terra:#B06E52;--terra-d:#8E5740;--terra-l:#F6E9E1;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',-apple-system,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.nav-logo{font-size:24px;font-weight:800;letter-spacing:-.03em}

.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:48px 24px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:var(--terra-l);color:var(--terra-d);border-radius:100px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:24px}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--terra)}
h1{font-size:clamp(36px,9vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1.02;max-width:14ch;text-wrap:balance}
h1 em{font-style:italic;color:var(--terra);font-weight:400}
p{font-size:17px;color:var(--slate);margin-top:18px;max-width:42ch;line-height:1.5}
.actions{display:flex;flex-direction:column;gap:12px;margin-top:32px;width:100%;max-width:380px}
.btn{display:block;width:100%;text-align:center;padding:16px 24px;border-radius:100px;font-size:15.5px;font-weight:700;transition:background .15s, transform .15s;border:none;cursor:pointer}
.btn-primary{background:var(--terra);color:#fff}
.btn-primary:hover{background:var(--terra-d);transform:translateY(-1px)}
.btn-ghost{border:1.5px solid var(--ink);color:var(--ink);background:transparent}
.btn-ghost:hover{background:var(--ink);color:#fff}

.notify-form{display:none;flex-direction:column;gap:12px;width:100%;text-align:left}
.notify-form.open{display:flex}
.notify-form label{font-size:13px;font-weight:600;color:var(--ink)}
.notify-form input{
  font:inherit;color:var(--ink);
  border:1.5px solid rgba(30,26,23,.18);
  background:#fff;padding:14px 16px;border-radius:12px;
  outline:none;transition:border-color .15s;width:100%;
}
.notify-form input:focus{border-color:var(--terra)}
.notify-form .field{display:flex;flex-direction:column;gap:6px}
.phone-row{display:grid;grid-template-columns:140px 1fr;gap:8px}
.phone-row select{padding:14px 8px}
.notify-success{display:none;margin-top:24px;padding:20px;background:var(--terra-l);color:var(--terra-d);border-radius:14px;font-weight:600;font-size:15px}
.notify-success.show{display:block}
</style>
</head>
<body>

<header class="nav">
  <a href="index.html" class="nav-logo">Nabad</a>
</header>

<section class="center">
  <span class="badge">Coming soon</span>
  <h1>The Nabad app is <em>almost here</em>.</h1>
  <p>We're putting the finishing touches on the iOS and Android apps. Want to be among the first to know when we launch?</p>

  <div class="actions">
    <button type="button" class="btn btn-primary" id="notifyBtn" onclick="document.getElementById('notifyForm').classList.add('open');this.style.display='none'">Notify me at launch</button>

    <form class="notify-form" id="notifyForm" onsubmit="event.preventDefault();document.getElementById('notifySuccess').classList.add('show');this.reset();this.classList.remove('open');">
      <div class="field">
        <label for="ne">Email *</label>
        <input id="ne" type="email" required placeholder="you@example.com"/>
      </div>
      <div class="field">
        <label for="np">Phone (optional)</label>
        <div class="phone-row">
          <select id="nc" aria-label="Country code">
            <option value="+961" selected>🇱🇧 +961</option>
            <option value="+971">🇦🇪 +971</option>
            <option value="+966">🇸🇦 +966</option>
            <option value="+974">🇶🇦 +974</option>
            <option value="+965">🇰🇼 +965</option>
            <option value="+973">🇧🇭 +973</option>
            <option value="+968">🇴🇲 +968</option>
            <option value="+962">🇯🇴 +962</option>
            <option value="+963">🇸🇾 +963</option>
            <option value="+20">🇪🇬 +20</option>
            <option value="+90">🇹🇷 +90</option>
            <option value="+33">🇫🇷 +33</option>
            <option value="+44">🇬🇧 +44</option>
            <option value="+49">🇩🇪 +49</option>
            <option value="+1">🇺🇸 +1</option>
            <option value="+61">🇦🇺 +61</option>
          </select>
          <input id="np" type="tel" placeholder="70 123 456"/>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Notify me</button>
    </form>

    <a href="index.html" class="btn btn-ghost">Back to home</a>
  </div>

  <div class="notify-success" id="notifySuccess">You're on the list — we'll be in touch at launch.</div>
</section>

</body>
</html>
